<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>From Hook to Dashboard using Mermaid</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="hook-to-dashboard-pipeline.js"></script>
</head>
<body>
    <main>
        <header class="sim-header">
            <h1>From Hook to Dashboard</h1>
            <div class="stepper">
                <button id="prevButton" type="button">Previous</button>
                <span id="stepLabel" class="step-label">Overview</span>
                <button id="nextButton" type="button">Next</button>
            </div>
        </header>
        <div class="legend" aria-hidden="true">
            <span><span class="swatch process"></span>Process (something runs)</span>
            <span><span class="swatch file"></span>Stored file</span>
            <span><span class="swatch dashboard"></span>Report you read</span>
        </div>
        <div id="diagram" class="diagram"></div>
        <section id="infobox" class="infobox" aria-live="polite"></section>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>
